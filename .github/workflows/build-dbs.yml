name: Build Offline Geocoding DBs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0' # Every Sunday at 02:00 UTC

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (osmium-tool)
        run: sudo apt-get update && sudo apt-get install -y osmium-tool

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Ukraine OSM Data
        run: python download.py

      - name: Run Pipeline for Kyiv Region
        run: python pipeline.py --input data/ukraine-latest.osm.pbf --region kyiv

      - name: Generate Date Tag
        id: date
        run: echo "tag=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: release-${{ steps.date.outputs.tag }}
          name: Database Release ${{ steps.date.outputs.tag }}
          files: |
            output/kyiv_region.db
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
