name: Build Offline Geocoding DBs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 0' # Every Sunday at 02:00 UTC

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies (osmium-tool)
        run: sudo apt-get update && sudo apt-get install -y osmium-tool jq

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download Ukraine OSM Data
        run: python download.py

      - name: Run Pipeline for All Regions
        run: |
          # Читаємо всі ключі (регіони) з regions.json і запускаємо для кожного
          for region in $(jq -r 'keys[]' regions.json); do
            echo "Processing region: $region"
            python pipeline.py --input data/ukraine-latest.osm.pbf --region "$region"
          done

      - name: Update Latest Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: "Latest Database Update"
          body: "Автоматично згенеровані бази даних. Оновлюються щотижня."
          files: output/*.db
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
